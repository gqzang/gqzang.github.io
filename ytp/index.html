<!DOCTYPE html>
<html> 
<head> 
	<title> 
		YouTube List Player (No-Ad)
	</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel = "icon" href = "./black_youtube.png" type = "image/x-icon"> 

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>    
	<script>
		window.jQuery || document.write('<script src="./jquery-3.3.1.min.js"><\/script>');
	</script>
    <script src="./ytp.js"></script> 
</head> 

<body background="../background.jpg"> 
	<div id="video-placeholder"></div>
	<br> 	
	<div> 
		Video Height:
		<select id="videoSizeSel"> 
			<option value="144">144</option> 
			<option value="240">240</option> 
			<option value="360" selected>360</option> 
			<option value="480">480</option> 
			<option value="720">720</option> 
			<option value="1080">1080</option> 
		</select> 
		
		&nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; 
		<button id="prev">Prev</button> 
		&nbsp;&nbsp;
		<button id="next">Next</button> 
		&nbsp;&nbsp; &nbsp;&nbsp; &nbsp;&nbsp; 

		<span id="status"></span>
		<br><br> 

		Playlist ID:
		<input type="text" id="pid" name="pid" size="30">
		&nbsp;&nbsp;
		<button id="shuffle">Play</button> 
		<button id="order">New First</button> 
		&nbsp;&nbsp;&nbsp;&nbsp;
		<button id="btn_pl">Playlists</button> 
		<div id="pan_pl">
			<br>
			<hr width="600" align="left">
			<strong>Playlists Played:</strong><br>
			<select name="history" id="plhis" size=1></select>
			<hr width="600" align="left">	
			<br>
		</div>

		<br><br>
		<span id="title"></span>
		<span id="all"></span>
		&nbsp;&nbsp; 
		<span id="curv"></span>		
		&nbsp;&nbsp;&nbsp;&nbsp; 
		<br> 	
		<select name="video list" id="list" size=10>
		</select>
		<div id="list2d">
		<br>
			Finished Videos: (click to restore)<br>
			<select name="video finished" id="list2" size=10>
			</select>
		</div>
	</div> 
</body> 
</html>
